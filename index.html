<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <title>Godzilla Minus One — Fan Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2305070a'/><path d='M4 28 L9 12 L12 20 L16 4 L20 20 L23 12 L28 28 Z' fill='%234db8ff'/></svg>" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="hud" class="hidden">
      <div id="objective"></div>
      <div id="barL" class="barwrap"><div class="barname"></div><div class="bar hp"><i></i></div><div class="bar en"><i></i></div></div>
      <div id="barR" class="barwrap right"><div class="barname"></div><div class="bar hp"><i></i></div></div>
      <div id="meter"><span></span><div class="bar"><i></i></div></div>
      <div id="subtitle"></div>
      <div id="prompt"></div>
      <div id="reticle"></div>
      <div id="marker"><b></b><span></span></div>
      <div id="timing"><div class="zone"></div><div class="cursor"></div></div>
      <div id="hint"></div>
      <button id="pauseBtn" aria-label="Pause">II</button>
    </div>

    <div id="touch" class="hidden">
      <div id="stick"><i></i></div>
      <div id="btns"></div>
    </div>

    <div id="vignette"></div>
    <div id="banner"><h2></h2><p></p></div>
    <div id="flash"></div>
    <div id="cards" class="hidden"><div class="card"><h3></h3><p></p><small></small></div><div class="next">▸ continue</div></div>
    <div id="screen" class="hidden"></div>
    <div id="fade"></div>
    <div id="loading"><span>Loading</span><div><i></i></div></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
